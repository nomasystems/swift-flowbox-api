name: Generated code

on:
  pull_request:
    paths:
      - "Spec/**"
      - "Sources/**"
      - "Package.swift"
      - "generate.sh"
      - ".github/workflows/generated-code.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  up-to-date:
    runs-on: [self-hosted, macOS, macstudio]
    steps:
      - uses: actions/checkout@v7
      - uses: nomasystems/action-xcode-select@v0.2
      - name: Regenerate from the current upstream spec
        run: ./generate.sh --refresh
      - name: Fail if the committed sources differ
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated sources are out of date. Run ./generate.sh --refresh and commit the result."
            git status --short
            git diff --stat
            exit 1
          fi
