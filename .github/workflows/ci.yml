name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, macOS, macstudio]
    steps:
      - uses: actions/checkout@v7
      - uses: nomasystems/action-xcode-select@v0.2
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Generate from the current upstream spec
        run: ./generate.sh --refresh
      - name: Build without warnings or errors
        shell: bash
        run: |
          swift build 2>&1 | tee build.log
          if grep -E "Sources/FlowboxAPI/.*(warning|error):" build.log; then
            echo "::error::The generated code does not build cleanly"
            exit 1
          fi
