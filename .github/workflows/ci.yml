name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nomasystems/action-xcode-select@0206818b1656e8f848594dee8c3603de16692bc2 # v0.2
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Regenerate from the current upstream spec
        run: ./generate.sh --refresh
      - name: Fail if the committed sources differ
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated sources are out of date. Run ./generate.sh --refresh and commit the result."
            git status --short
            git diff --stat
            exit 1
          fi
